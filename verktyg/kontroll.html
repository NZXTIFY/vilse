<!doctype html>
<meta charset="utf-8">
<title>Täckningskontroll</title>
<!-- Visar ett rutnät av Street View-vyer för att se vilka platser som saknar bilder (svart ruta). -->
<style>
  body { margin: 0; background: #222; font: 12px system-ui; }
  #grid { display: grid; grid-template-columns: repeat(var(--k, 4), 1fr); grid-auto-rows: calc(100vh / var(--r, 4)); gap: 2px; height: 100vh; }
  .cell { position: relative; overflow: hidden; }
  .cell iframe { width: 100%; height: 100%; border: 0; }
  .cell span { position: absolute; left: 0; bottom: 0; background: #ff0; color: #000; padding: 1px 4px; font-weight: 700; }
</style>
<div id="grid"></div>
<script src="../platser.js?v=10"></script>
<script>
  const p = new URLSearchParams(location.search);
  const from = +(p.get('from') || 0), n = p.get('idx') ? p.get('idx').split(',').length : p.get('orter') ? p.get('orter').split(',').length : +(p.get('n') || 16);
  const grid = document.getElementById('grid');
  const k = Math.ceil(Math.sqrt(n * 1.33));
  grid.style.setProperty('--k', k);
  grid.style.setProperty('--r', Math.ceil(n / k));
  // ?orter=Umeå,Falun visar bara de namngivna platserna
  const orter = p.get('orter') ? p.get('orter').split(',') : null;
  // ?idx=12,40,41 visar platserna med de numren
  const idx = p.get('idx') ? p.get('idx').split(',').map(Number) : null;
  const urval = idx ? idx.map(i => [PLATSER[i], i]) : orter ? PLATSER.map((pl, i) => [pl, i]).filter(([pl]) => orter.includes(pl[2])) : PLATSER.slice(from, from + n).map((pl, i) => [pl, from + i]);
  urval.forEach(([[lat, lng, ort], nr]) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = `<iframe src="https://maps.google.com/maps?layer=c&cbll=${lat},${lng}&cbp=12,0,0,0,0&output=svembed"></iframe><span>${nr} ${ort}</span>`;
    grid.appendChild(c);
  });
  document.title = `${from}–${from + n - 1} av ${PLATSER.length}`;
</script>
